<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .box { fill: #f8f9fa; stroke: #495057; stroke-width: 1.5; rx: 6; }
      .hub { fill: #e7f5ff; stroke: #1971c2; }
      .engine { fill: #fff3bf; stroke: #e67700; }
      .page { fill: #d3f9d8; stroke: #2f9e44; }
      .title { font-size: 14px; font-weight: 600; fill: #212529; }
      .sub { font-size: 11px; fill: #495057; }
      .arrow { stroke: #868e96; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .label { font-size: 10px; fill: #868e96; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#868e96"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="640" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" class="title" font-size="18">Session Driver — Architecture</text>

  <!-- Entry -->
  <rect class="box" x="40" y="70" width="180" height="70"/>
  <text x="130" y="100" text-anchor="middle" class="title">sd (bash)</text>
  <text x="130" y="118" text-anchor="middle" class="sub">entry point · --loop</text>

  <!-- Engine -->
  <rect class="engine" x="280" y="60" width="200" height="90"/>
  <text x="380" y="92" text-anchor="middle" class="title">watch.py</text>
  <text x="380" y="110" text-anchor="middle" class="sub">collect · merge · render</text>
  <text x="380" y="128" text-anchor="middle" class="sub">PR watch · cleanup · queue</text>

  <!-- Data sources -->
  <rect class="box" x="40" y="200" width="160" height="50"/>
  <text x="120" y="230" text-anchor="middle" class="sub">~/.claude/projects</text>

  <rect class="box" x="220" y="200" width="160" height="50"/>
  <text x="300" y="230" text-anchor="middle" class="sub">Cowork sessions</text>

  <rect class="box" x="400" y="200" width="160" height="50"/>
  <text x="480" y="230" text-anchor="middle" class="sub">git / gh</text>

  <!-- Pages -->
  <rect class="page" x="620" y="70" width="280" height="70"/>
  <text x="760" y="100" text-anchor="middle" class="title">Pinned pages</text>
  <text x="760" y="118" text-anchor="middle" class="sub">Home Sessions Watch · Code Sessions Watch</text>

  <!-- Scans Hub -->
  <rect class="hub" x="40" y="310" width="220" height="80"/>
  <text x="150" y="340" text-anchor="middle" class="title">Scans Hub</text>
  <text x="150" y="358" text-anchor="middle" class="sub">optional Code session</text>
  <text x="150" y="376" text-anchor="middle" class="sub">sd-classify · sd-publish</text>

  <!-- Trackers Hub -->
  <rect class="hub" x="300" y="310" width="240" height="80"/>
  <text x="420" y="340" text-anchor="middle" class="title">Trackers Hub</text>
  <text x="420" y="358" text-anchor="middle" class="sub">Code session kept open</text>
  <text x="420" y="376" text-anchor="middle" class="sub">delivers messages via app</text>

  <!-- Queue -->
  <rect class="box" x="580" y="320" width="180" height="60"/>
  <text x="670" y="350" text-anchor="middle" class="title">work/hub/queue.jsonl</text>
  <text x="670" y="368" text-anchor="middle" class="sub">events for sessions</text>

  <!-- Sessions -->
  <rect class="box" x="780" y="320" width="140" height="60"/>
  <text x="850" y="350" text-anchor="middle" class="title">Code sessions</text>
  <text x="850" y="368" text-anchor="middle" class="sub">PR · page · doc</text>

  <!-- Cleanup -->
  <rect class="box" x="40" y="450" width="180" height="50"/>
  <text x="130" y="480" text-anchor="middle" class="sub">worktree cleanup</text>

  <rect class="box" x="240" y="450" width="180" height="50"/>
  <text x="330" y="480" text-anchor="middle" class="sub">purge_old.py (manual)</text>

  <!-- Arrows -->
  <path class="arrow" d="M220 105 H280"/>
  <path class="arrow" d="M480 105 H620"/>
  <path class="arrow" d="M120 150 V200"/>
  <path class="arrow" d="M300 150 V200"/>
  <path class="arrow" d="M480 150 V200"/>
  <path class="arrow" d="M150 390 V450"/>
  <path class="arrow" d="M380 150 V310"/>
  <path class="arrow" d="M540 350 H580"/>
  <path class="arrow" d="M760 350 H780"/>

  <!-- Labels -->
  <text x="250" y="98" class="label">runs</text>
  <text x="540" y="98" class="label">publishes</text>
  <text x="400" y="290" class="label">queues</text>
  <text x="560" y="340" class="label">delivers</text>

  <!-- Legend -->
  <rect class="engine" x="40" y="540" width="16" height="16"/>
  <text x="64" y="553" class="sub">engine</text>
  <rect class="hub" x="140" y="540" width="16" height="16"/>
  <text x="164" y="553" class="sub">hub (Code session)</text>
  <rect class="page" x="300" y="540" width="16" height="16"/>
  <text x="324" y="553" class="sub">output page</text>
  <rect class="box" x="420" y="540" width="16" height="16"/>
  <text x="444" y="553" class="sub">data / side effect</text>
</svg>
